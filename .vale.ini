StylesPath = styles
MinAlertLevel = warning

Packages = https://github.com/stakater/vale-package/releases/download/v0.0.104/Stakater.zip
Vocab = Stakater

# Only check MarkDown files
[*.md]

BasedOnStyles = Vale

# content/reference/api.md is machine-generated from the operator's Go types
# (via crd-ref-docs). It contains API identifiers and verbatim code comments
# (e.g. the `finops.stakater.com` group, camelCase field names like `cpuHour`,
# enum values), not prose, so prose style rules don't apply.
[content/reference/api.md]
BasedOnStyles =
Vale.Terms = NO
Vale.Spelling = NO
